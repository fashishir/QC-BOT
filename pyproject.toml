[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-exam-mcq-bank"
version = "1.0.0"
description = "Ethical 2025-2026 Bangladesh job-exam MCQ archive with public answers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "PyYAML>=6.0",
  "streamlit>=1.32",
  "weasyprint>=60",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
job-scraper = "job_scraper.cli:main"

[tool.setuptools.packages.find]
include = ["job_scraper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
