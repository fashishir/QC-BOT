# =====================================================================
# SSC Archive Bot - example configuration
#
# IMPORTANT (ethics & legality):
#   * All sources are DISABLED by default. Enable a source only after you
#     have reviewed its terms of service and robots.txt yourself.
#   * The bot respects robots.txt, rate-limits every request, and never
#     bypasses authentication, CAPTCHAs, paywalls or anti-bot protection.
#   * Sources that return 401/403 are automatically flagged for
#     'manual_review' and skipped.
#   * Every stored file keeps its source URL for attribution.
# =====================================================================

settings:
  # Identify your bot honestly; put a real contact address.
  user_agent: "SSC-Archive-Bot/1.0 (+educational archive; contact=you@example.com)"

  # Politeness / rate limiting (per host)
  request_delay_seconds: 5.0
  max_retries: 4
  backoff_factor: 2.0
  request_timeout_seconds: 30
  respect_robots_txt: true

  # Safety caps
  max_pages_per_source: 500
  max_file_size_mb: 100

  # File types to collect (HTML pages are crawled, not saved, by default)
  allowed_extensions: [.pdf, .doc, .docx, .jpg, .jpeg, .png]
  download_html_pages: false

  # Storage / output locations
  storage_root: data
  logs_dir: logs
  reports_dir: reports

  database:
    backend: sqlite              # 'sqlite' or 'postgres'
    sqlite_path: ssc_archive.db
    postgres_dsn: null           # e.g. postgresql://user:pass@localhost:5432/ssc

  ocr:
    enabled: false               # requires Tesseract + 'ben' language pack
    tesseract_cmd: null          # e.g. C:/Program Files/Tesseract-OCR/tesseract.exe
    languages: ben+eng
    min_text_chars_to_skip_ocr: 200
    max_pages: 30

# -------------------------------------------------------------------------
# Sources: add one block per website. seed_urls can point to board pages,
# year-wise pages, subject-wise pages or PDF archive pages.
# -------------------------------------------------------------------------
sources:
  - name: example_board_site
    enabled: false               # <- review ToS/robots.txt, then set true
    base_url: https://www.example-board.gov.bd
    seed_urls:
      - https://www.example-board.gov.bd/question-archives
      - https://www.example-board.gov.bd/ssc-questions-2024
    allow_domains:
      - www.example-board.gov.bd
    keywords: [question, ssc, archive]   # optional URL filter
    notes: null

  - name: example_archive_portal
    enabled: false
    base_url: https://www.sattacademy.com/board-exams
    seed_urls:
      - https://www.sattacademy.com/ssc-questions/
    allow_domains:
      - www.sattacademy.com
      - files.sattacademy.com
    keywords: [ssc, question]
    notes: null

  # Example of a source already known to need manual review:
  # - name: example_blocked_site
  #   enabled: false
  #   base_url: https://www.example-protected-site.com
  #   seed_urls: [https://www.example-protected-site.com/ssc]
  #   allow_domains: [www.example-protected-site.com]
  #   notes: "manual review: site returned 403 on last automated visit"

  # -----------------------------------------------------------------------
  # Satt Academy question bank (sattacademy.com/board-exams).
  #
  # Data received by Board Name + Exam Name. URLs verified against the live
  # site (listing: /board-exams/{class-slug}?board={board-slug}&year={year};
  # exams: /board-exams/{exam-slug}/mcq|written).
  #
  # KEEP DISABLED until you have reviewed the site's terms of service and
  # robots.txt yourself. The adapter never follows '?page=' links - those
  # are disallowed by the site's robots.txt. Truncated listings are
  # flagged 'listing_truncated' for manual review instead.
  # -----------------------------------------------------------------------
  - name: sattacademy
    enabled: false
    adapter: sattacademy
    base_url: https://sattacademy.com
    seed_urls:
      - https://sattacademy.com/board-exams
    allow_domains:
      - sattacademy.com
      - www.sattacademy.com
    keywords: [board-exams, ssc, hsc]
    params:
      class_keys: [ssc, dakhil, hsc]   # ssc = Class 9-10 general, dakhil = madrasah, hsc = Class 11-12
      # Bangla board slugs (from the site's board dropdown). Comment out any
      # boards you do not want to collect.
      board_slugs:
        - \u09a2\u09be\u0995\u09be-\u09ac\u09cb\u09b0\u09cd\u09a1        # dhaka
        - \u09b0\u09be\u099c\u09b6\u09be\u09b9\u09c0-\u09ac\u09cb\u09b0\u09cd\u09a1      # rajshahi
        - \u099a\u099f\u09cd\u099f\u0997\u09cd\u09b0\u09be\u09ae-\u09ac\u09cb\u09b0\u09cd\u09a1    # chattogram
        - \u09b8\u09bf\u09b2\u09c7\u099f-\u09ac\u09cb\u09b0\u09cd\u09a1          # sylhet
        - \u09af\u09b6\u09cb\u09b0-\u09ac\u09cb\u09b0\u09cd\u09a1          # jessore
        - \u0995\u09c1\u09ae\u09bf\u09b2\u09cd\u09b2\u09be-\u09ac\u09cb\u09b0\u09cd\u09a1        # cumilla
        - \u09a6\u09bf\u09a8\u09be\u099c\u09aa\u09c1\u09b0-\u09ac\u09cb\u09b0\u09cd\u09a1      # dinajpur
        - \u09ac\u09b0\u09bf\u09b6\u09be\u09b2-\u09ac\u09cb\u09b0\u09cd\u09a1        # barishal
        - \u09b8\u0995\u09b2-\u09ac\u09cb\u09b0\u09cd\u09a1          # combined (all)
        - \u09ae\u09df\u09ae\u09a8\u09b8\u09bf\u0982\u09b9-\u09ac\u09cb\u09b0\u09cd\u09a1      # mymensingh
        - \u09ae\u09be\u09a6\u09cd\u09b0\u09be\u09b8\u09be-\u09b6\u09bf\u0995\u09cd\u09b7\u09be-\u09ac\u09cb\u09b0\u09cd\u09a1  # madrasah
        - \u0995\u09be\u09b0\u09bf\u0997\u09b0\u09bf-\u09b6\u09bf\u0995\u09cd\u09b7\u09be-\u09ac\u09cb\u09b0\u09cd\u09a1      # technical
        - \u09b8\u09ae\u09a8\u09cd\u09ac\u09bf\u09a4-\u09ac\u09cb\u09b0\u09cd\u09a1        # combined
      years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
      question_types: [mcq, written]
    notes: null
